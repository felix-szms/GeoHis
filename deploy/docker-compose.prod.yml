name: geohis-prod
# 生产部署（腾讯云 106.55.164.220）：
#   - 不占用宿主机端口（对同机其它容器应用零影响）
#   - web 接入外部网络 stic_default，由 stic-caddy 以容器名反代：geohis.scitechsz.com → geohis-web:80
#   - HTTPS 证书由 Caddy 自动签发续期
# 用法: cd <repo> && docker compose -f deploy/docker-compose.prod.yml --project-directory . up -d --build
# （--project-directory . 使相对路径均以仓库根为基准）
services:
  web:
    image: nginx:1.27-alpine
    container_name: geohis-web
    expose:
      - "80"
    volumes:
      # 整个仓库只读挂载：site/ 主页 + 各课程目录（含 fetch 下载的瓦片/字体/音乐与 engine/ 同步副本）
      - ./:/srv:ro
      # 生产用 nginx.prod.conf：Linux 上开启 sendfile 与文件句柄缓存（本地开发版因 Windows FUSE 层需关闭）
      - ./deploy/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/mime-extra.conf:/etc/nginx/conf.d/00-mime-extra.conf:ro
    networks:
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/courses.json"]
      interval: 30s
      timeout: 5s
      retries: 3

  assets-init:
    build:
      context: .
      dockerfile: deploy/Dockerfile.init
    container_name: geohis-assets-init
    volumes:
      - ./:/srv
    working_dir: /srv
    environment:
      - FETCH_CONCURRENCY=8
      - GEOHIS_ROOT=/srv
    restart: "no"

networks:
  proxy:
    external: true
    name: stic_default
