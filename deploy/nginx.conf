# GeoHis 本地部署 nginx 配置
# 路由复刻 site/scripts/serve.mjs：
#   /                    → site/index.html
#   /courses.json        → site/courses.json
#   /shared/...          → site/shared/...
#   /engine/...          → engine/（app.js / interactive.js / vendor）
#   /courses/<id>/...    → <repo>/<id>/...（目录默认 interactive.html）
#   /courses/<id>        → 301 到 /courses/<id>/

map $uri $cache_control {
    # 代码与数据会随更新变化：不缓存（no-cache 允许复用但必须再验证）
    ~*\.(html|js|mjs|json)$                        "no-cache";
    # 素材不可变：长缓存
    ~*\.(jpe?g|png|webp|mp3|ttf|otf|woff2|svg)$    "public, max-age=604800";
    default                                        "no-cache";
}

server {
    listen 80;
    server_name _;

    root /srv/site;
    index index.html;

    # 站点主页与共享资源（root=/srv/site）
    location = /courses.json { try_files /courses.json =404; }
    location ^~ /shared/     { try_files $uri =404; }

    # 共享引擎（app.js / interactive.js / vendor：gsap + three）
    location ^~ /engine/     { alias /srv/engine/; }

    # 课程挂载：/courses/<id>/<rest> → /srv/<id>/<rest>
    location ~ ^/courses/(?<cid>[^/]+)/(?<rest>.*)$ {
        alias /srv/$cid/$rest;
        index interactive.html;
    }
    # 无尾斜杠 → 补斜杠（让上面的 regex location 命中 index）
    location ~ ^/courses/(?<cid2>[^/]+)$ {
        return 301 /courses/$cid2/;
    }

    # 其余一律回主页（保持与 node 服务 404 行为接近，但本地访问体验更好）
    location / { try_files $uri $uri/ /index.html; }

    # 隐藏版本号；禁止点文件；相对重定向（不携带容器内端口）
    server_tokens off;
    absolute_redirect off;
    location ~ /\. { deny all; }

    # 静态资源长缓存（map 决定），html 类不缓存
    add_header Cache-Control $cache_control;

    # 压缩文本类资源（瓦片 jpg/png/mp3 已是压缩格式，不重复压缩）
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    # 大字体/音乐文件传输
    # 注意：仓库目录经 Docker Desktop 文件共享层（FUSE）挂载，sendfile 在该层上会挂起部分读请求
    # （表现为页面瓦片加载卡死在 92%），必须关闭 sendfile 改用常规读
    sendfile off;
    tcp_nopush on;
}
