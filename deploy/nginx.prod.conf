# GeoHis 生产环境 nginx 配置（Linux 服务器 / deploy/docker-compose.prod.yml 挂载）
# 与 nginx.conf 的差异：Linux 上开启 sendfile 与文件句柄缓存（Windows Docker Desktop 的
# FUSE 文件共享层必须关 sendfile，故本地开发版保持 sendfile off）
# 路由与缓存策略同 nginx.conf：
#   /  /courses.json  /shared/  /engine/  /courses/<id>/（目录默认 interactive.html）
map $uri $cache_control {
    # 代码与数据会随更新变化：不缓存（no-cache 允许复用但必须再验证）
    ~*\.(html|js|mjs|json)$                        "no-cache";
    # 素材不可变：长缓存（瓦片/字体/音乐；字体换版本时以 ?v= 参数 bust）
    ~*\.(jpe?g|png|webp|mp3|ttf|otf|woff2|svg)$    "public, max-age=604800";
    default                                        "no-cache";
}

server {
    listen 80;
    server_name _;

    root /srv/site;
    index index.html;

    location = /courses.json { try_files /courses.json =404; }
    location ^~ /shared/     { try_files $uri =404; }

    # 共享引擎（app.js / interactive.js / vendor：gsap + three）
    location ^~ /engine/     { alias /srv/engine/; }

    # 课程挂载：/courses/<id>/<rest> → /srv/<id>/<rest>
    location ~ ^/courses/(?<cid>[^/]+)/(?<rest>.*)$ {
        alias /srv/$cid/$rest;
        index interactive.html;
    }
    location ~ ^/courses/(?<cid2>[^/]+)$ {
        return 301 /courses/$cid2/;
    }

    location / { try_files $uri $uri/ /index.html; }

    server_tokens off;
    absolute_redirect off;
    location ~ /\. { deny all; }

    add_header Cache-Control $cache_control;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

    # Linux 生产优化：零拷贝发送 + 小瓦片文件句柄缓存
    sendfile on;
    tcp_nopush on;
    open_file_cache max=2000 inactive=300s;
    open_file_cache_valid 120s;
    open_file_cache_errors on;
}
