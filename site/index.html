<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>跟着地图学历史 · 互动历史课堂</title>
    <style>
      @font-face {
        font-family: "MaShanZheng";
        src: url("./shared/fonts/MaShanZheng-Regular.ttf?v=2") format("truetype");
      }
      @font-face {
        font-family: "SourceHanSerif";
        src: url("./shared/fonts/SourceHanSerifCN-Regular.otf?v=2") format("opentype");
        font-weight: 400;
      }
      @font-face {
        font-family: "SourceHanSerif";
        src: url("./shared/fonts/SourceHanSerifCN-Bold.otf?v=2") format("opentype");
        font-weight: 700;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --bg: #0d0b08; --panel: rgba(14, 11, 8, 0.88);
        --gold: #e0cf9f; --gold-bright: #f3e2b3; --gold-dim: #b3a582;
        --line: rgba(206, 166, 92, 0.28); --text: #cfc4ae;
      }
      body {
        background: var(--bg); color: var(--text);
        font-family: "SourceHanSerif", "Songti SC", serif; overflow-x: hidden;
      }
      a { color: inherit; text-decoration: none; }

      /* ---------- Hero ---------- */
      .hero {
        position: relative; min-height: 78vh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; overflow: hidden;
      }
      .hero .bg {
        position: absolute; inset: 0; background-size: cover; background-position: center;
        background-image: url("./shared/img/world-map.jpg");
        filter: brightness(0.42) sepia(0.18); opacity: 0.85;
      }
      @keyframes drift { from { transform: scale(1); } to { transform: scale(1.08) translateX(-2%); } }
      .hero::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(rgba(13,11,8,0.35), rgba(13,11,8,0.92) 88%, var(--bg));
      }
      .hero > * { position: relative; z-index: 2; }
      .hero h1 {
        font-family: "MaShanZheng", "Kaiti SC", serif; color: var(--gold-bright);
        font-size: clamp(56px, 9vw, 118px); font-weight: 400; letter-spacing: 0.22em; text-indent: 0.22em;
        text-shadow: 0 4px 40px rgba(0,0,0,0.85);
      }
      .hero .tagline {
        margin-top: 26px; color: #e0d4b0; font-size: clamp(17px, 2.4vw, 26px);
        letter-spacing: 0.3em; text-indent: 0.3em; text-shadow: 0 2px 14px rgba(0,0,0,0.9);
      }
      .hero .sub {
        margin-top: 18px; color: #97896b; font-size: 15px; letter-spacing: 0.24em;
        font-family: Georgia, serif;
      }
      .hero .enter {
        margin-top: 52px; display: inline-block; border: 1px solid rgba(206,166,92,0.55);
        color: var(--gold); padding: 13px 40px; letter-spacing: 0.4em; text-indent: 0.4em;
        font-size: 16px; transition: all 0.2s; background: rgba(14,11,8,0.55);
      }
      .hero .enter:hover { background: rgba(96,74,36,0.85); color: #f7e6b8; border-color: #e8cf8e; }

      /* ---------- 系列筛选 ---------- */
      main { max-width: 1240px; margin: 0 auto; padding: 30px 28px 90px; }
      .series-row { display: flex; flex-wrap: wrap; gap: 12px; margin: 26px 0 34px; }
      .chip {
        border: 1px solid var(--line); background: var(--panel); color: var(--gold);
        padding: 9px 20px; letter-spacing: 0.16em; font-size: 15px; cursor: pointer; transition: all 0.18s;
        user-select: none;
      }
      .chip:hover { border-color: rgba(240,205,126,0.7); color: #f7e6b8; }
      .chip.active { background: rgba(96,74,36,0.9); color: #f7e6b8; border-color: #e8cf8e; }
      .chip.planned { opacity: 0.45; cursor: default; }
      .chip.planned::after { content: " · 筹备中"; font-size: 12px; letter-spacing: 0.1em; color: #8a7f66; }

      /* ---------- 课程卡片 ---------- */
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 26px; }
      .card {
        background: var(--panel); border: 1px solid var(--line);
        transition: transform 0.22s ease, border-color 0.22s, box-shadow 0.22s;
      }
      .card:hover {
        transform: translateY(-5px); border-color: rgba(240,205,126,0.75);
        box-shadow: 0 18px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(240,205,126,0.25);
      }
      .card .cover { position: relative; aspect-ratio: 16/9; overflow: hidden; }
      .card .cover img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.88) sepia(0.08); transition: transform 0.4s; }
      .card:hover .cover img { transform: scale(1.04); }
      .card .cover .dur {
        position: absolute; right: 12px; bottom: 10px; background: rgba(8,6,4,0.82);
        color: #e0cf9f; font-size: 13px; padding: 3px 10px; font-family: Georgia, serif;
      }
      .card .body { padding: 22px 24px 24px; }
      .card .series-tag { color: #8a7f66; font-size: 12.5px; letter-spacing: 0.3em; }
      .card h2 {
        font-family: "MaShanZheng", "Kaiti SC", serif; color: var(--gold-bright);
        font-size: 42px; font-weight: 400; margin: 8px 0 4px; letter-spacing: 0.08em;
      }
      .card .meta { color: #cdc0a2; font-size: 15px; letter-spacing: 0.06em; }
      .card .meta b { color: #e0cf9f; }
      .card .desc { margin-top: 12px; color: #b8ab8d; font-size: 14.5px; line-height: 1.85; min-height: 54px; }
      .card .go {
        margin-top: 18px; display: flex; align-items: center; justify-content: space-between;
        border-top: 1px solid rgba(206,166,92,0.18); padding-top: 16px;
      }
      .card .go .stat { color: #97896b; font-size: 13.5px; letter-spacing: 0.1em; }
      .card .go .btn {
        border: 1px solid rgba(206,166,92,0.5); color: var(--gold); padding: 8px 22px;
        letter-spacing: 0.3em; text-indent: 0.3em; font-size: 14px; transition: all 0.18s;
      }
      .card:hover .go .btn { background: rgba(96,74,36,0.9); color: #f7e6b8; border-color: #e8cf8e; }

      /* ---------- 筹备中的篇章 ---------- */
      .planned-sec { margin-top: 70px; }
      .planned-sec h3 {
        color: var(--gold-dim); font-size: 15px; letter-spacing: 0.4em; font-weight: 400;
        border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 20px;
      }
      .planned-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
      .planned-card { border: 1px dashed rgba(206,166,92,0.3); padding: 20px 22px; }
      .planned-card h4 { color: #cdc0a2; font-size: 19px; letter-spacing: 0.16em; font-weight: 700; }
      .planned-card p { color: #8a7f66; font-size: 13.5px; line-height: 1.8; margin-top: 8px; }

      /* ---------- 页脚 ---------- */
      footer {
        border-top: 1px solid rgba(206,166,92,0.15); margin-top: 90px; padding: 34px 28px 44px;
        text-align: center; color: #6f6650; font-size: 13px; line-height: 2; letter-spacing: 0.06em;
      }
      footer b { color: #8a7f66; font-weight: 400; }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="bg" id="heroBg"></div>
      <h1>跟着地图学历史</h1>
      <div class="tagline">把伟大的一生，画成一条可以交互的航线</div>
      <div class="sub">NASA SATELLITE TERRAIN · THREE.JS · INTERACTIVE HISTORY</div>
      <a class="enter" href="#courses">进入课堂</a>
    </section>

    <main id="courses">
      <div class="series-row" id="seriesRow"></div>
      <div class="grid" id="cardGrid"></div>

      <section class="planned-sec">
        <h3>制 作 中 的 篇 章</h3>
        <div class="planned-grid" id="plannedGrid"></div>
      </section>
    </main>

    <footer>
      <b>跟着地图学历史</b> · 互动历史课堂<br />
      地图数据 NASA Blue Marble（公有领域）· Terrain Tiles Mapzen/AWS · 音乐 Kevin MacLeod（CC BY）·
      字体 马善政毛笔楷书 / 思源宋体（OFL）· 插图 公有领域（Wikimedia Commons）<br />
      本站为教学用途 · 渲染管线 three.js · GSAP · HyperFrames
    </footer>

    <script type="module">
      const res = await fetch("./courses.json");
      const data = await res.json();
      // Hero 背景固定为世界地图（CSS 内联），不随课程切换

      // 系列筛选
      let active = "all";
      const row = document.getElementById("seriesRow");
      const chips = [{ id: "all", name: "全 部", status: "live" }, ...data.series];
      for (const s of chips) {
        const c = document.createElement("div");
        c.className = "chip" + (s.status === "planned" ? " planned" : "") + (s.id === "all" ? " active" : "");
        c.textContent = s.name;
        if (s.status !== "planned") {
          c.onclick = () => {
            active = s.id;
            [...row.children].forEach((x) => x.classList.toggle("active", x === c));
            render();
          };
        }
        row.appendChild(c);
      }

      const grid = document.getElementById("cardGrid");
      function render() {
        grid.innerHTML = "";
        const list = data.courses.filter((c) => active === "all" || c.series === active);
        for (const c of list) {
          const seriesName = data.series.find((s) => s.id === c.series)?.name || "";
          const card = document.createElement("a");
          card.className = "card";
          card.href = c.path;
          card.innerHTML = `
            <div class="cover"><img src="${c.cover}" alt="${c.title}" /><span class="dur">${c.duration}</span></div>
            <div class="body">
              <div class="series-tag">${seriesName} · 第 ${String(data.courses.indexOf(c) + 1).padStart(2, "0")} 课</div>
              <h2>${c.title}</h2>
              <div class="meta"><b>${c.person}</b> · ${c.years}</div>
              <div class="desc">${c.desc}</div>
              <div class="go"><span class="stat">${c.stations} 个站点 · 可交互</span><span class="btn">开始学习</span></div>
            </div>`;
          grid.appendChild(card);
        }
      }
      render();

      // 筹备中的篇章
      const pg = document.getElementById("plannedGrid");
      for (const s of data.series.filter((x) => x.status === "planned")) {
        const d = document.createElement("div");
        d.className = "planned-card";
        d.innerHTML = `<h4>${s.name}</h4><p>${s.desc}</p>`;
        pg.appendChild(d);
      }
    </script>
  </body>
</html>
